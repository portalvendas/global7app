# Global 7 — Web (Next.js PWA). Blueprint Render: web service Docker.
# A API é consumida via NEXT_PUBLIC_API_URL (default já aponta pro global7app).
services:
  - type: web
    name: global7-web
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://global7app.onrender.com
