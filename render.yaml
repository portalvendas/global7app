# ─────────────────────────────────────────────────────────────────────────────
# Global 7 — API (NestJS + Prisma). Blueprint Render: API (Docker) + PostgreSQL.
# Render → New > Blueprint → conecte o repo global7-api.
# Redis/BullMQ e disco entram na Fase 3 (Daily offline / fotos).
# ─────────────────────────────────────────────────────────────────────────────
databases:
  - name: global7-db
    databaseName: global7
    user: global7
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: global7-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: global7-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: SEED_ON_BOOT
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
